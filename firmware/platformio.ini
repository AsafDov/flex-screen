; flex-screen deck: Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB panel, GT911 touch,
; ESP32-S3 with 8 MB octal PSRAM and 16 MB quad flash).
[platformio]
; `pio run -t upload` updates the deck over its own USB link. deck-esptool is for a deck
; that won't boot and is only used when named (-e deck-esptool).
default_envs = deck
; The deck rebuilds ESP-IDF with its own settings (custom_sdkconfig below) into the
; PlatformIO packages folder, so it gets a PlatformIO folder of its own: in the shared one,
; any build without those settings (another project, an older branch) would reinstall the
; framework, and the next deck build would rebuild it again (~15 min).
core_dir = ~/.platformio-deck

[env:deck]
; Pinned: 55.03.312+ reject pioarduino core "6.2.0.post1" as older than 6.2.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; The SCons PlatformIO itself runs on: the platform asks for 4.8.1, and with ESP-IDF's
; rebuild each installed its own over the other halfway through a build.
platform_packages =
  tool-scons @ https://github.com/pioarduino/scons/releases/download/4.11.1/scons-local-4.11.1.tar.gz
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; ESP-IDF's build looks for the partition table in the project; Arduino's in its own folder.
board_build.partitions = ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/default_16MB.csv
; Replaces the devkit's flags, which hard-code ARDUINO_USB_MODE=1 (USB-Serial-JTAG).
; Mode 0 hands the native port to TinyUSB for the CDC + HID composite device.
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1

; ESP-IDF rebuilt with these settings (pioarduino's hybrid compile; DESIGN.md, firmware
; 0.27.0). Changing them rebuilds ESP-IDF (~15 min); src/ alone builds in ~3.
; - Caches: 64 KB of data cache with 64-byte lines, 32 KB of instruction cache. Flash, PSRAM
;   and the panel's refills share one bus, and fewer misses leave more of it for drawing.
;   Costs 48 KB of internal RAM (the caches are made of it).
; - XIP from PSRAM: code and constants (the fonts too) are copied into PSRAM at start and
;   run from there: octal PSRAM moves a cache line in about a quarter of quad flash's time.
;   Costs PSRAM the size of the app (~1.3 MB).
; - SPIRAM_BOOT_*: the rebuild starts from Arduino's generic ESP32-S3 settings, not its
;   octal-PSRAM build's; these put back PSRAM set up and in the heap during startup (else
;   ESP-IDF reports PSRAM's lowest free as 0). TinyUSB, also missing there: components/.
; - RESTART_IN_VSYNC=n: Arduino's builds restart the panel's DMA every frame, and in that
;   branch ESP-IDF 5.5 never resets the count whose parity says which bounce buffer to
;   refill: one late refill (a flash write, PSRAM busy) and the picture stayed torn and
;   shifted past the screen's edges until a replug. ESP-IDF's default counts each frame's
;   refills and restarts after a short one, with the count reset: one bad frame at most.
custom_sdkconfig =
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_IGNORE_NOTFOUND=y
  CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=n

; `pio run -t upload` sends the firmware over the deck's own serial link and the running
; firmware installs it (scripts/ota_upload.py). scripts/deck_port.py stops the companion
; app, which holds that port, for the upload and starts it again afterwards.
; scripts/idf_rebuild.py: the rebuild's fixes (a Windows command-line limit, and reusing
; the rebuilt framework in a new checkout).
upload_protocol = custom
upload_command = "$PYTHONEXE" scripts/ota_upload.py "$SOURCE"
extra_scripts =
  pre:scripts/idf_rebuild.py
  pre:scripts/deck_port.py
monitor_speed = 115200

lib_deps =
  lvgl/lvgl@9.6.0
  bblanchon/ArduinoJson@^7.4.2

; LVGL draws on the CPU; -O2 instead of -Os makes a full redraw noticeably faster.
build_unflags = -Os
; The --wrap flags: the deck's loop allocates from PSRAM first, other tasks keep ESP-IDF's
; rule (src/psram_first.h).
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -Wl,--wrap=malloc
  -Wl,--wrap=calloc
  -Wl,--wrap=realloc
  -Wl,--wrap=xTaskCreatePinnedToCore

; Recovery: flash through the chip's ROM bootloader, for a deck whose firmware can't take
; an update over the link (first flash, or a build that crashes on boot). On the native
; port, deck_port.py reboots a running deck into the bootloader with a 1200-baud open; a
; deck that doesn't respond needs BOOT held while tapping RESET first. On the UART port
; (CH343), it always needs BOOT + RESET.
[env:deck-esptool]
extends = env:deck
upload_protocol = esptool
; Not env:deck's OTA uploader, which this env otherwise inherits: esptool itself.
upload_command =
; Only matters on the UART port, which corrupts reads at 921600.
upload_speed = 460800
